name: Verify Source Hub and website
on:
  pull_request:
    paths:
      - 'source-hub/**'
      - 'source-hub-api/**'
      - '.github/workflows/source-hub.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 source-hub-api/test_ingest.py
      - run: python3 source-hub-api/test_research_adapter.py
      - run: python3 source-hub-api/test_source_policy.py
      - run: python3 source-hub-api/test_codex_capture_e2e.py
      - run: python3 source-hub-api/load_test.py
      - run: node source-hub-api/navigation_test.js
      - run: python3 prepare_public_site.py
      - run: python3 apply_approved_case_studies.py
      - run: python3 apply_case2_purchase.py
      - run: python3 qa/verify_evidence_chamber_release.py
      - run: python3 apply_evidence_chamber.py
      - run: python3 apply_frozen_website.py
      - run: python3 generate_uniform_site.py
      - run: python3 publish_research_modules.py
      - run: python3 qa/verify_uniform_site.py
      - run: python3 qa/verify_frozen_website.py
      - run: python3 qa/regress_site.py
      - run: python3 source-hub-api/check_public_build.py
      - name: Run controlled Codex research task and verify automatic filing
        run: |
          set -o pipefail
          python3 source-hub-api/codex_research.py | tee "$RUNNER_TEMP/gate2-receipt.json"
      - name: Retain sanitized filing evidence
        uses: actions/upload-artifact@v4
        with:
          name: source-hub-gate2-receipt
          path: ${{ runner.temp }}/gate2-receipt.json
          if-no-files-found: error
      - name: Run controlled Gate 3 multi-source research and verify filing
        run: |
          set -o pipefail
          python3 source-hub-api/codex_research_gate3.py | tee "$RUNNER_TEMP/gate3-receipts.json"
      - name: Retain sanitized Gate 3 filing evidence
        uses: actions/upload-artifact@v4
        with:
          name: source-hub-gate3-receipts
          path: ${{ runner.temp }}/gate3-receipts.json
          if-no-files-found: error
      - name: Verify persistent Gate 4 registry, crash recovery and policy lifecycle
        run: |
          set -o pipefail
          python3 source-hub-api/test_gate4.py | tee "$RUNNER_TEMP/gate4-evidence.jsonl"
      - name: Retain sanitized Gate 4 verification
        uses: actions/upload-artifact@v4
        with:
          name: source-hub-gate4-evidence
          path: ${{ runner.temp }}/gate4-evidence.jsonl
          if-no-files-found: error
  windows-private:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python prepare_public_site.py
      - run: python apply_approved_case_studies.py
      - run: python apply_case2_purchase.py
      - run: python qa/verify_evidence_chamber_release.py
      - run: python apply_evidence_chamber.py
      - run: python apply_frozen_website.py
      - run: python generate_uniform_site.py
      - run: python publish_research_modules.py
      - run: python qa/verify_uniform_site.py
      - run: python qa/verify_frozen_website.py
      - run: python qa/regress_site.py
      - run: python source-hub-api/check_public_build.py
      - run: python source-hub-api/test_gate6_scan.py
      - name: Scan clean generated Windows website for Gate 6
        run: python source-hub-api/gate6_close.py --ci-scan
      - name: Verify native Windows private storage and research intake
        shell: pwsh
        run: |
          python source-hub-api/test_gate5_windows.py | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'gate5-evidence.jsonl')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain sanitized Windows evidence
        uses: actions/upload-artifact@v4
        with:
          name: source-hub-gate5-windows-evidence
          path: ${{ runner.temp }}/gate5-evidence.jsonl
          if-no-files-found: error

  journal-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify reviewed journal filing and anonymous public search
        run: |
          export SOURCE_HUB_DB="$RUNNER_TEMP/journal-public.db"
          export PYTHONPATH="$GITHUB_WORKSPACE/source-hub-api"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          from threading import Thread
          from urllib.parse import urlencode
          from urllib.request import urlopen

          import server

          manifest = Path(os.environ["RUNNER_TEMP"]) / "reviewed-journals.json"
          article = {
              "title": "Synthetic journal verification",
              "authors": ["Example Author"],
              "publisher": "Example Publisher",
              "publication_date": "2026",
              "doi": "10.9999/synthetic-journal-verification",
              "url": "https://example.org/journal-verification",
              "access": "open_access",
          }
          command = [sys.executable, "source-hub-api/project.py",
                     "--reviewed-journal-manifest", str(manifest)]
          manifest.write_text(json.dumps([article]), encoding="utf-8")
          for _ in range(2):
              subprocess.run(command, check=True)
          manifest.write_text(json.dumps([
              dict(article, doi="10.9999/rollback"),
              dict(article, private_note="test marker"),
          ]), encoding="utf-8")
          rejected = subprocess.run(command, capture_output=True, text=True)
          assert rejected.returncode and "invalid_journal_fields" in rejected.stderr

          with server.ThreadingHTTPServer(("127.0.0.1", 0), server.Handler) as http:
              worker = Thread(target=http.serve_forever, daemon=True)
              worker.start()
              try:
                  query = urlencode({"type": "Journal article"})
                  url = f"http://127.0.0.1:{http.server_port}/api/sources?{query}"
                  with urlopen(url, timeout=5) as response:
                      items = json.load(response)["items"]
                  assert len(items) == 1 and items[0]["url"] == article["url"]
                  assert "test marker" not in json.dumps(items)
              finally:
                  http.shutdown()
                  worker.join()
          PY
