name: Cloudflare pilot validation
on:
  push:
    branches: [feature/cloudflare-source-hub-pilot]
    paths:
      - 'source-hub-api/cloudflare-pilot/**'
      - '.github/workflows/cloudflare-pilot-validation.yml'
      - 'source-hub/index.html'
permissions:
  contents: read
jobs:
  validate:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test source-hub-api/cloudflare-pilot/*.test.mjs
