name: Deploy audited public website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and prepare audited static release
        run: python3 prepare_public_site.py
      - name: Apply approved multilingual case-study release
        run: python3 apply_approved_case_studies.py
      - name: Add approved Case Study 2 purchase offer
        run: python3 apply_case2_purchase.py
      - name: Apply approved CRSIS-47 Evidence Chamber identity
        run: python3 apply_evidence_chamber.py
      - name: Verify complete site references
        run: python3 qa/regress_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
